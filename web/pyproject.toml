[project]
name = "conjurer-web"
version = "0.1.0"
description = "Web UI for the Conjurer resume pipeline. Server-rendered FastAPI + Jinja2 + HTMX; fixture-backed offline config and a live Claude Agent SDK backend."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.9",
    "claude-agent-sdk==0.2.163",
    "pypdf>=6.19.0",
    "python-docx>=1.2.0,<2",
    "reportlab>=5.0.1,<6",
    "markdown-it-py>=4.0.0,<5",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "pytest-cov>=7.1.0",
    "jsonschema>=4.26.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Coverage gate: see .claude/rules/testing.md. A passing `uv run pytest` proves 100%
# line + branch coverage of app/. Live-only paths are marked under markers, not exempted.
addopts = "--cov=app --cov=evals --cov-branch --cov-report=term-missing -m 'not live'"
markers = [
    "live: exercises a real API (Claude, or TypeSafe Jev); skipped without its credentials",
]
filterwarnings = [
    # Third-party: Starlette's TestClient warns about its bundled httpx. Not ours to fix.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.ty.environment]
# composition.py imports the conjurer plugin scripts (stitch/lint/export_docs) after a
# runtime sys.path insert; point ty at that dir so it resolves them statically too.
extra-paths = ["../plugins/conjurer/skills/conjurer/scripts"]

[tool.coverage.run]
branch = true
source = ["app", "evals"]

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "^\\s*\\.\\.\\.$",            # Protocol method stubs
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
