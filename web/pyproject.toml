[project]
name = "conjurer-web"
version = "0.1.0"
description = "Web UI for the Conjurer resume pipeline. Server-rendered FastAPI + Jinja2 + HTMX, mock data."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.9",
    "claude-agent-sdk==0.2.87",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    # Third-party: Starlette's TestClient warns about its bundled httpx. Not ours to fix.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
