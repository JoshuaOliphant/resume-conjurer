[project]
name = "conjurer-web"
version = "0.1.0"
description = "Web UI for the Conjurer resume pipeline. Server-rendered FastAPI + Jinja2 + HTMX, mock data."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.9",
    "claude-agent-sdk==0.2.87",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Coverage gate: see .claude/rules/testing.md. A passing `uv run pytest` proves 100%
# line + branch coverage of app/. Live-only paths are marked under markers, not exempted.
addopts = "--cov=app --cov-branch --cov-report=term-missing -m 'not live'"
markers = [
    "live: exercises the real Claude API; skipped unless ANTHROPIC_API_KEY is set",
]
filterwarnings = [
    # Third-party: Starlette's TestClient warns about its bundled httpx. Not ours to fix.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "^\\s*\\.\\.\\.$",            # Protocol method stubs
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
