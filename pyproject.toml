[project]
name = "resume-conjurer-dev"
version = "0.1.0"
description = "Dev tooling for the resume-conjurer plugin scripts (tests only; runtime scripts are stdlib)."
requires-python = ">=3.11"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=plugins --cov=scripts --cov-branch --cov-report=term-missing"

[tool.coverage.run]
branch = true
source = ["plugins", "scripts"]

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
